#
# Applies the org C-* change-type label (C-Feature / C-Bug / ...) to a PR based
# on its conventional-commit title prefix. Combined with .github/release.yml,
# this makes `gh release create --generate-notes` group PRs by type, which flows
# into resq-software/landing's changelog aggregator so its feature/fix/kind
# classification is automatic rather than a default guess. Path labels come from
# .github/labeler.yml; this covers the change *type* that paths cannot express.
name: Conventional Title Labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- needs write access; guarded by same-repo check
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Map conventional title prefix to a C-* label
        # TITLE is read from env (never interpolated into the script) to avoid
        # zizmor template-injection. The type is the leading token before an
        # optional scope and colon, e.g. `feat(ui)!: ...` -> `feat`.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          type="$(printf '%s' "$TITLE" | sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')"
          label=""
          case "$type" in
            feat|feature) label="C-Feature" ;;
            fix)          label="C-Bug" ;;
            perf)         label="C-Performance" ;;
            docs)         label="C-Documentation" ;;
            refactor)     label="C-Refactor" ;;
            test)         label="C-Testing" ;;
            chore|build|ci|style|revert) label="C-Chore" ;;
            *) echo "Title has no conventional type prefix." ;;
          esac
          # On an edited title, drop the stale change-type label so a PR is
          # never filed under two release-note sections; A-*/pkg:*/P-* stay.
          managed="C-Feature C-Bug C-Performance C-Documentation C-Refactor C-Testing C-Chore"
          current="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq ".labels[].name")"
          args=()
          for m in $managed; do
            [ "$m" = "$label" ] && continue
            if grep -Fxq "$m" <<<"$current"; then
              args+=(--remove-label "$m")
            fi
          done
          # Add the target only when it is not already present, so an unchanged
          # correct label makes no gh pr edit call (args stays empty -> no-op).
          if [ -n "$label" ] && ! grep -Fxq "$label" <<<"$current"; then
            args+=(--add-label "$label")
          fi
          if [ "${#args[@]}" -eq 0 ]; then
            echo "Change-type labels already correct; nothing to do."
            exit 0
          fi
          echo "Applying label changes: ${args[*]}"
          # Tolerate only a missing-label error (target not yet created by
          # Label Sync); surface auth, permission, rate-limit, network fails.
          set +e
          out="$(gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" "${args[@]}" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "$out"
            exit 0
          fi
          if grep -qiE "not found|not resolve|does not exist|label with the name" <<<"$out"; then
            echo "::warning::a managed label is not created yet (run Label Sync); skipped."
            echo "$out"
            exit 0
          fi
          echo "$out" >&2
          exit "$status"
