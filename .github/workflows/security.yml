#
# Thin caller for the org-wide reusable security-scan workflow in
# resq-software/.github.

name: security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    # Job-scoped permissions: the reusable's zizmor job uploads SARIF
    # (security-events:write); dependency-review reads PR metadata;
    # codeql-action telemetry needs actions:read. These stay as they are —
    # zizmor still uploads through github/codeql-action/upload-sarif, which
    # default setup does not reject.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: read
    # Pin the reusable workflow to a commit SHA so a forced branch
    # rewrite in resq-software/.github cannot silently change the
    # scanners that run here. Bump deliberately on upstream changes.
    # Skip on Dependabot PRs: a cross-repo reusable workflow called with `secrets: inherit`
    # startup-fails for Dependabot's restricted context, which blocks Dependabot's own security
    # PRs. Dependabot already vetted the bump; push/schedule still scan the default branch.
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: resq-software/.github/.github/workflows/security-scan.yml@73b9edb8f4f28a99f70ee22eb5e2dd2bf7807c84
    with:
      # `languages` is deliberately omitted. It defaults to "[]", and
      # security-scan gates its CodeQL job on
      #   if: ${{ inputs.languages != '' && inputs.languages != '[]' }}
      # so the job is skipped rather than run-and-discarded.
      #
      # Code-scanning *default setup* is enabled on this repository, and
      # GitHub refuses advanced-setup CodeQL uploads while it is. This job
      # logged, on every run:
      #   Analysis upload status is failed.
      #   CodeQL analyses from advanced configurations cannot be processed
      #   when the default setup is enabled
      #   CodeQL job status was configuration error.
      # and still reported success — the reusable carries
      # `continue-on-error: true` on its Analyze step, and the `##[error]` is
      # emitted by that step itself, in its main phase, which is exactly what
      # that flag swallows. (Only the trailing "CodeQL job status was ..." line
      # is printed after the step, by init-post; a passing run prints it too,
      # reading "was success".) A configuration error had become a permanent
      # green check.
      #
      # Coverage is unchanged: every stored CodeQL analysis here already
      # comes from default setup, which runs the broader `extended` query
      # suite rather than the default suite this job used.
      enable-semgrep: true
    # The reusable security-scan.yml does not declare a
    # `workflow_call.secrets:` block, so explicit per-secret passing
    # is rejected by GitHub Actions. `inherit` is required for
    # SEMGREP_APP_TOKEN (and would also cover SNYK_TOKEN /
    # GITLEAKS_LICENSE if those are enabled). Ack the zizmor warn.
    secrets: inherit  # zizmor: ignore[secrets-inherit]
