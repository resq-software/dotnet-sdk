#
# Thin CI wrapper. Dispatches to the org-wide reusable `required`
# aggregator in resq-software/.github (which calls dotnet-ci +
# security-scan). The top-level `required` job emits the status-
# check context consumed by the org ruleset `default-branch-baseline`.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Job-scoped permissions: CodeQL needs security-events:write to
    # upload SARIF; PR metadata read is needed by some scanners.
    # Keeping the workflow-level grant at contents:read avoids
    # blanket write tokens for follow-on jobs.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: read
    uses: resq-software/.github/.github/workflows/required.yml@f4b51a620aa1bf89c0bce4f434b36f92ff7d517d
    with:
      lang: dotnet
      dotnet-solution: ResQ.Sdk.sln
      codeql-languages: '["csharp"]'
    # No org secrets are required for the CodeQL-only path
    # (semgrep / gitleaks / snyk are disabled here). GITHUB_TOKEN
    # is automatic, so we drop the unconditional secrets:inherit.

  required:
    name: required
    runs-on: ubuntu-latest
    needs: [gates]
    if: always()
    steps:
      - env:
          R: ${{ needs.gates.result }}
        run: |
          set -eu
          case "$R" in
            success|skipped|"") echo "ok: gates=$R" ;;
            *) echo "::error::gates reusable returned: $R"; exit 1 ;;
          esac

  # Publish a GitHub Release per v* tag so resq-software/landing's changelog
  # aggregator picks the version up — the aggregator ingests GitHub *Releases*,
  # not git tags. Gated on the `required` aggregator so a release is only cut
  # once CI is green, and only on a v* tag push.
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [required]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create GitHub Release from the tag
        # `gh` reads $GH_TOKEN and $GITHUB_REPOSITORY automatically; the tag is
        # passed via env (never `${{ }}` inside run:) to avoid template injection.
        # --generate-notes builds notes from merged PRs since the previous tag
        # (categorized by .github/release.yml); --verify-tag asserts the ref is
        # a real tag first.
        run: >
          gh release create "$TAG"
          --title "$TAG"
          --generate-notes
          --verify-tag
