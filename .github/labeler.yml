# ── Package scope labels (NuGet projects in ResQ.Sdk.sln) ────────────────
# Each ResQ.* project lives at the repo root, which is the path ResQ.Sdk.sln
# references.

"pkg:core":
  - changed-files:
    - any-glob-to-any-file:
      - ResQ.Core/**/*

"pkg:blockchain":
  - changed-files:
    - any-glob-to-any-file:
      - ResQ.Blockchain/**/*

"pkg:clients":
  - changed-files:
    - any-glob-to-any-file:
      - ResQ.Clients/**/*

"pkg:protocols":
  - changed-files:
    - any-glob-to-any-file:
      - ResQ.Protocols/**/*

"pkg:simulation":
  - changed-files:
    - any-glob-to-any-file:
      - ResQ.Simulation/**/*

"pkg:storage":
  - changed-files:
    - any-glob-to-any-file:
      - ResQ.Storage/**/*

# ── Area labels ─────────────────────────────────────────────────────────

"A-DevOps":
  - changed-files:
    - any-glob-to-any-file:
      - .github/**/*
      - .git-hooks/**/*
      - scripts/**/*
      - bootstrap.sh
      - agent-sync.sh

"A-Build":
  - changed-files:
    - any-glob-to-any-file:
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - ResQ.Sdk.sln
      - Dockerfile
      - flake.nix
      - flake.lock

"A-Protos":
  - changed-files:
    - any-glob-to-any-file:
      - protos/**/*
      - "**/*.proto"

"A-Release":
  - changed-files:
    - any-glob-to-any-file:
      - CHANGELOG.md

# ── Category labels ─────────────────────────────────────────────────────

"C-Documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.md"
      - docs/**/*
      - NUGET_README.md

"C-Testing":
  - changed-files:
    - any-glob-to-any-file:
      - tests/**/*
      - ResQ.Clients.Tests/**/*
      - "**/*.Tests/**/*"